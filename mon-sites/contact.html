<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact de Tinihau</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Retour à l'accueil</a>
        </nav>
        <h1>Me contacter</h1>
        <nav>
           <a href="mailto:tinihau.picard@ynov.com">Envoyer un mail</a>
        </nav>
    </header>
    <main>
        <form>
            <label for="name">Nom :</label>
            <input type="text" id="name" name="name" required><br>
            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required><br>
            <label for="sujet">Sujet :</label>
            <select id="sujet" name="sujet">
                <option value="demande">Demande d'information</option>
                <option value="projet">Proposition de projet</option>
                <option value="autre">Autre</option>
            </select><br>
            <label for="message">Message :</label><br>
            <textarea id="message" name="message" rows="5" cols="30"></textarea><br>
            <input type="checkbox" id="cpgu">
            <label for="cpgu">J'accepte d'être recontacté(e)</label><br>
            <input type="submit" value="Envoyer">
        </form>
    </main>
    <footer> Tinihau Picard © 2026</footer>
</body>
</html>
